[package]
name = "writer-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Writers rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
writer-geom = { workspace = true }
writer-doc = { workspace = true }
writer-fonts = { workspace = true }
writer-layout = { workspace = true }
writer-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
