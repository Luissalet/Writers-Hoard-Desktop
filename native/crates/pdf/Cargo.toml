[package]
name = "writer-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Writers PDF export (krilla): embedded font subsets with selectable text, links, outline, tagging"

[lints]
workspace = true

[dependencies]
writer-doc = { workspace = true }
writer-geom = { workspace = true }
writer-fonts = { workspace = true }
writer-layout = { workspace = true }
writer-metafile = { workspace = true }
krilla = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock (`SystemTime::now()` panics on wasm32).
js-sys = "0.3"

[dev-dependencies]
writer-formats = { workspace = true }
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
