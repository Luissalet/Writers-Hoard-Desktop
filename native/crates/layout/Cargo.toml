[package]
name = "writer-layout"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Writers layout: shaping, line breaking, tabs, lists, tables, pagination, headers/footers, hit testing"

[lints]
workspace = true

[dependencies]
writer-geom = { workspace = true }
writer-doc = { workspace = true }
writer-fonts = { workspace = true }
writer-proof = { workspace = true }
unicode-bidi = { workspace = true }
unicode-linebreak = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-normalization = "0.1.24"
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock (`SystemTime::now()`/`Instant::now()` panic on wasm32).
js-sys = "0.3"
