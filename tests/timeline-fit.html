<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Own Timeline Fit oracle</title></head><body class="bg-deep text-text-primary"><div id="root"></div><script type="module">
import '/src/index.css';import '/src/engines/timeline/index.ts';globalThis.IS_REACT_ACT_ENVIRONMENT=true;
window.addEventListener('error',event=>window.__result={ok:false,error:event.error?.stack||event.message});
try{const mode=new URL(location.href).searchParams.get('case');let tests;if(mode==='era-switch'){tests=await (await import('/tests/timeline-engine-era-switch.browser.tsx')).testTimelineEngineEraSwitch();}else if(mode==='manual'){(await import('/tests/timeline-fit-manual.tsx')).mountTimelineFitManual();tests=null;}else if(mode==='review'){await (await import('/tests/timeline-fit-review.tsx')).mountTimelineFitReview();tests=null;}else if(mode==='contract'){tests=await (await import('/tests/timeline-fit-contract.browser.tsx')).testTimelineFitContracts();}else if(mode==='scopes'){tests=await (await import('/tests/timeline-scopes.browser.tsx')).testTimelineScopes();}else if(mode==='precision'){tests=await (await import('/tests/timeline-precision-settings.browser.ts')).testTimelinePrecisionSettings();}else{tests=await (await import('/tests/timeline-fit.browser.tsx')).testTimelineFit();}if(tests)window.__result={ok:true,tests};}catch(error){window.__result={ok:false,error:error.stack||String(error)};}
</script></body></html>
